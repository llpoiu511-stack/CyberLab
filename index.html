<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ساوي شاي</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;

      background:
        radial-gradient(circle at center, #3b281d 0%, #120c08 45%, #050403 100%);

      font-family: Arial, sans-serif;
    }

    h1 {
      font-size: clamp(70px, 14vw, 180px);
      font-weight: 900;
      letter-spacing: -5px;

      background: linear-gradient(
        120deg,
        #fff3d0,
        #d9a65a,
        #fff8df,
        #a96f35,
        #fff3d0
      );

      background-size: 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;

      animation: shine 5s linear infinite;

      filter: drop-shadow(0 0 30px rgba(218, 166, 90, 0.25));
    }

    @keyframes shine {
      0% {
        background-position: 0% center;
      }

      100% {
        background-position: 300% center;
      }
    }
  </style>
</head>

<body>

  <h1>ساوي شاي</h1>

</body>
</html>
