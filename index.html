<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ساوي شاي يا إيلاف</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #080808;
            font-family: Arial, sans-serif;
        }

        h1 {
            color: #d4af37;
            font-size: clamp(45px, 9vw, 130px);
            font-weight: 900;
            text-align: center;

            text-shadow:
                0 0 5px #d4af37,
                0 0 15px #d4af37,
                0 0 35px rgba(212, 175, 55, 0.6);

            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from {
                transform: scale(1);
                text-shadow:
                    0 0 5px #d4af37,
                    0 0 15px #d4af37,
                    0 0 30px rgba(212, 175, 55, 0.5);
            }

            to {
                transform: scale(1.03);
                text-shadow:
                    0 0 10px #fff0a0,
                    0 0 25px #d4af37,
                    0 0 55px rgba(212, 175, 55, 0.8);
            }
        }
    </style>
</head>

<body>

    <h1>ساوي شاي يا إيلاف</h1>

</body>
</html>
